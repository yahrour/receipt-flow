services:
  frontend:
    build: ./frontend
    networks:
      - app-network
    ports:
      - 8080:8080
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

  migrate:
    build:
      context: ./backend
      target: build
    command: npx tsx /app/scripts/init.ts
    networks:
      - app-network
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    networks:
      - app-network
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env

  db:
    image: postgres:latest
    networks:
      - app-network
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=receipt_flow
    volumes:
      - app-volume:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d receipt_flow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  app-network:

volumes:
  app-volume:
